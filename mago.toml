php-version = "8.5"

[source]
paths = ["src", "tests"]
includes = ["vendor"]

# CS-1: 4 spaces and a soft line length of 120 characters.
[formatter]
print-width = 120
tab-width = 4
use-tabs = false
sort-uses = "preserve"
separate-use-types = true
expand-use-groups = true

# CS-1 §1: every file declares strict types.
[linter.rules.strict-types]
enabled = true
level = "error"
allow-disabling = false

# CS-1 §5: root-level functions, classes, and constants are imported with a use statement, never used unqualified or
# written fully qualified.
[linter.rules.ambiguous-function-call]
enabled = true
level = "error"

[linter.rules.ambiguous-constant-access]
enabled = true
level = "error"

[linter.rules.no-fully-qualified-global-constant]
enabled = true
level = "error"

[linter.rules.no-fully-qualified-global-function]
enabled = true
level = "error"

[linter.rules.no-fully-qualified-global-class-like]
enabled = true
level = "error"

# CS-1 §1 and CS-2 §1: StudlyCaps class-likes and enum cases without Interface, Trait, or Abstract affixes, SNAKE_CASE
# constants, and camelCase methods, properties, and variables.
[linter.rules.class-name]
enabled = true
level = "error"
psr = false

[linter.rules.interface-name]
enabled = true
level = "error"
psr = false

[linter.rules.trait-name]
enabled = true
level = "error"
psr = false

[linter.rules.enum-name]
enabled = true
level = "error"

[linter.rules.constant-name]
enabled = true
level = "error"

[linter.rules.function-name]
enabled = true
level = "error"
camel = true
either = false

[linter.rules.method-name]
enabled = true
level = "error"
camel = true
either = false
# Test methods are snake_case under a #[Test] attribute, which this rule does not recognise: it only treats methods named
# test* as tests. Their names are left to review.
exclude = ["tests/"]

[linter.rules.property-name]
enabled = true
level = "error"
camel = true
either = false

[linter.rules.variable-name]
enabled = true
level = "error"
camel = true
either = false
check-parameters = true

# CS-3 §2: tests are marked with the #[Test] attribute rather than a test prefix.
[linter.rules.prefer-test-attribute]
enabled = true
level = "error"

# CS-1 §17: closures and arrow functions that do not use $this are static.
[linter.rules.prefer-static-closure]
enabled = true
level = "error"

[linter.rules.too-many-methods]
enabled = false

[linter.rules.excessive-parameter-list]
enabled = false

[linter.rules.cyclomatic-complexity]
enabled = false

[linter.rules.kan-defect]
enabled = false

[linter.rules.too-many-properties]
enabled = false

# `dependency` and `on` recurse only with `**`; a single `*` matches one segment.
# `allow-from` and `deny-from` match the using namespace by prefix, so
# `Dirthara\Entity` would match every namespace in the package. The rules are
# written as denials for that reason, and "only the root namespace" is therefore
# not expressible.
[guard.perimeter]
restrictions = [
    { dependency = "Dirthara\\Database\\**", deny-from = [
        "Dirthara\\Entity\\Attribute",
        "Dirthara\\Entity\\Hydration",
        "Dirthara\\Entity\\Metadata",
        "Dirthara\\Entity\\Naming",
        "Dirthara\\Entity\\Type",
    ] },
    { dependency = "Dirthara\\Collection\\**", deny-from = [
        "Dirthara\\Entity\\Attribute",
        "Dirthara\\Entity\\Exception",
        "Dirthara\\Entity\\Hydration",
        "Dirthara\\Entity\\Metadata",
        "Dirthara\\Entity\\Naming",
        "Dirthara\\Entity\\Persistence",
        "Dirthara\\Entity\\Type",
    ] },
    { dependency = "Dirthara\\Entity\\Metadata\\**", deny-from = [
        "Dirthara\\Entity\\Attribute",
        "Dirthara\\Entity\\Exception",
        "Dirthara\\Entity\\Naming",
        "Dirthara\\Entity\\Type",
    ] },
    { dependency = "Dirthara\\Entity\\Naming\\**", deny-from = [
        "Dirthara\\Entity\\Attribute",
        "Dirthara\\Entity\\Exception",
        "Dirthara\\Entity\\Hydration",
        "Dirthara\\Entity\\Persistence",
        "Dirthara\\Entity\\Query",
        "Dirthara\\Entity\\Type",
    ] },
    { dependency = "Dirthara\\Entity\\Type\\**", deny-from = [
        "Dirthara\\Entity\\Attribute",
        "Dirthara\\Entity\\Exception",
        "Dirthara\\Entity\\Hydration",
        "Dirthara\\Entity\\Naming",
        "Dirthara\\Entity\\Persistence",
        "Dirthara\\Entity\\Query",
    ] },
    { dependency = "Dirthara\\Entity\\Hydration\\**", deny-from = [
        "Dirthara\\Entity\\Attribute",
        "Dirthara\\Entity\\Exception",
        "Dirthara\\Entity\\Metadata",
        "Dirthara\\Entity\\Naming",
        "Dirthara\\Entity\\Persistence",
        "Dirthara\\Entity\\Type",
    ] },
    { dependency = "Dirthara\\Entity\\Persistence\\**", deny-from = [
        "Dirthara\\Entity\\Attribute",
        "Dirthara\\Entity\\Exception",
        "Dirthara\\Entity\\Hydration",
        "Dirthara\\Entity\\Metadata",
        "Dirthara\\Entity\\Naming",
        "Dirthara\\Entity\\Query",
        "Dirthara\\Entity\\Type",
    ] },
    { dependency = "Dirthara\\Entity\\Query\\**", deny-from = [
        "Dirthara\\Entity\\Attribute",
        "Dirthara\\Entity\\Exception",
        "Dirthara\\Entity\\Hydration",
        "Dirthara\\Entity\\Metadata",
        "Dirthara\\Entity\\Naming",
        "Dirthara\\Entity\\Persistence",
        "Dirthara\\Entity\\Type",
    ] },
    { dependency = "Dirthara\\Entity\\Attribute\\**", deny-from = [
        "Dirthara\\Entity\\Hydration",
        "Dirthara\\Entity\\Naming",
        "Dirthara\\Entity\\Persistence",
        "Dirthara\\Entity\\Query",
        "Dirthara\\Entity\\Type",
    ] },
    { dependency = "Dirthara\\Entity\\Exception\\**", deny-from = [
        "Dirthara\\Entity\\Attribute",
        "Dirthara\\Entity\\Naming",
    ] },
]

[[guard.structural.rules]]
on = "Dirthara\\Entity\\**"
not-on = "Dirthara\\Entity\\{Metadata\\RelationMetadata,Tests\\EntityTestCase,Tests\\Integration\\EntityConformanceTestCase,Tests\\Doubles\\AbstractConverter,Tests\\Entities\\Invalid\\AbstractEntity}"
target = "class"
must-be-final = true
reason = "Classes are final (CS-1 §15); only abstract bases are open, and an abstract class cannot be final."

[[guard.structural.rules]]
on = "Dirthara\\Entity\\Exception\\**"
target = "class"
must-be-named = "*Exception"
must-implement = "Dirthara\\Entity\\Exception\\EntityException"
must-use-trait = "Dirthara\\Entity\\Exception\\HasExceptionContext"
reason = "Package exceptions implement EntityException and use HasExceptionContext (CS-7)."

[[guard.structural.rules]]
on = "Dirthara\\Entity\\Attribute\\**"
target = "class"
must-be-readonly = true
must-use-attribute = "Attribute"
reason = "An attribute is read-only data PHP builds from the entity's declaration."

[[guard.structural.rules]]
on = "Dirthara\\Entity\\Type\\Converter\\**"
not-on = "Dirthara\\Entity\\Type\\Converter\\Composite\\**"
target = "class"
must-be-readonly = true
must-implement = "Dirthara\\Entity\\Type\\ColumnConverter"
reason = "A converter is stateless and is reached through the interface the registry stores; one outside Composite maps a single column."

[[guard.structural.rules]]
on = "Dirthara\\Entity\\Type\\Converter\\Composite\\**"
target = "class"
must-be-readonly = true
must-implement = "Dirthara\\Entity\\Type\\CompositeConverter"
reason = "A converter under Composite maps a property to more than one column."

# CS-3: test classes are suffixed with Test. must-extend checks only the direct parent, and most tests extend
# EntityTestCase or EntityConformanceTestCase rather than TestCase, so the base class is left to PHPUnit.
[[guard.structural.rules]]
on = "Dirthara\\Entity\\Tests\\**"
not-on = "Dirthara\\Entity\\Tests\\{Doubles\\**,Entities\\**,Fixtures\\**,EntityTestCase,Integration\\EntityConformanceTestCase}"
target = "class"
must-be-named = "*Test"
reason = "Test classes are suffixed with Test (CS-3)."
